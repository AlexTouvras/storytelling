name: Refresh which-model catalog

# The live desk reads the frozen pack. This job replaces it on the first
# of the month from the OpenRouter catalog, then asks Orbit to sync.
# A push made with GITHUB_TOKEN does not start notify-orbit, so the
# dispatch below is the sync. A missing curated id fails the job.

on:
  schedule:
    # 13:00 UTC on the 1st, the same hour as Orbit's other live desks.
    - cron: "0 13 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-which-model
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Fetch the catalog and freeze the pack
        run: npm run refresh:which-model

      - name: Commit the extract
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/sources/openrouter-which-model.json \
            data/figures/which-model.v1.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Which model catalog unchanged."
            exit 0
          fi
          git commit -m "chore: refresh the which-model catalog"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Ask Orbit to sync the pack
        if: steps.commit.outputs.changed == 'true'
        id: dispatch
        continue-on-error: true
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.ORBIT_DISPATCH_TOKEN }}
          repository: AlexTouvras/Orbit
          event-type: storytelling-sync
          client-payload: '{"source":"which-model-refresh","sha":"${{ github.sha }}"}'

      - name: ORBIT_DISPATCH_TOKEN not configured
        if: steps.commit.outputs.changed == 'true' && steps.dispatch.outcome == 'failure'
        run: |
          echo "::warning::The catalog was committed, but storytelling-sync was not dispatched."
          echo "Add repo secret ORBIT_DISPATCH_TOKEN (contents:write on Orbit),"
          echo "or run Sync storytelling manually on AlexTouvras/Orbit."
