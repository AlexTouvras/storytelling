name: Notify Orbit storytelling sync

# A push to main asks Orbit to copy this engine and redeploy /stories.
# Requires repo secret ORBIT_DISPATCH_TOKEN (contents:write on AlexTouvras/Orbit).

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "data/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch storytelling-sync on Orbit
        id: dispatch
        continue-on-error: true
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.ORBIT_DISPATCH_TOKEN }}
          repository: AlexTouvras/Orbit
          event-type: storytelling-sync
          client-payload: '{"source":"storytelling","sha":"${{ github.sha }}"}'

      - name: ORBIT_DISPATCH_TOKEN not configured
        if: ${{ steps.dispatch.outcome == 'failure' }}
        run: |
          echo "::warning::Could not dispatch storytelling-sync to AlexTouvras/Orbit."
          echo "Add repo secret ORBIT_DISPATCH_TOKEN (contents:write on Orbit),"
          echo "or run Sync storytelling manually on AlexTouvras/Orbit."
